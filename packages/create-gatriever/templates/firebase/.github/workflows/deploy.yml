name: Deploy to Firebase

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Prepare Gatriever deployment artifacts
        run: npx gatriever prepare

      - name: Deploy to Firebase Functions
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only functions
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

      - name: Register Telegram Webhook (if URL configured)
        if: env.TELEGRAM_WEBHOOK_URL != ''
        run: |
          npx gatriever set-webhook --token "${{ secrets.TELEGRAM_BOT_TOKEN }}" --url "${{ secrets.TELEGRAM_WEBHOOK_URL }}"
        env:
          TELEGRAM_WEBHOOK_URL: ${{ secrets.TELEGRAM_WEBHOOK_URL }}
